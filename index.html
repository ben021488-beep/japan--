<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>葵花寶典</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F6F1EA;--card:#FFFDF9;--ink:#3B3530;--soft:#857A70;--matcha:#9C6B48;--mist:#EFE5D9;--sakura:#C0584F;--rose:#F8E6E1;--line:#E3D8CB;--gold:#B98C33;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 配色：奶茶（預設）、天空、櫻花、夜間、抹茶 */
:root[data-skin="sky"]{--paper:#EEF3F8;--card:#FFFFFF;--ink:#25303B;--soft:#6B7886;--matcha:#43729F;--mist:#DDE8F3;--sakura:#C4566A;--rose:#F6E3E7;--line:#D3DEE9;--gold:#B3852B}
:root[data-skin="sakura"]{--paper:#FBF2F2;--card:#FFFCFC;--ink:#3D2E31;--soft:#8C7478;--matcha:#A95A6E;--mist:#F6E1E5;--sakura:#C0473F;--rose:#FBE3DE;--line:#EDD6DA;--gold:#B0852F}
:root[data-skin="night"]{--paper:#1D1E22;--card:#26282D;--ink:#E6E2DB;--soft:#9D988F;--matcha:#CFA67B;--mist:#34312D;--sakura:#E38C8C;--rose:#3B2828;--line:#3A3B41;--gold:#DDB662}
:root[data-skin="matcha"]{--paper:#EEF3EC;--card:#FFFFFF;--ink:#1D2A22;--soft:#5E6E63;--matcha:#35774A;--mist:#D6E5D6;--sakura:#C43E63;--rose:#F7E3E9;--line:#C3D3C4;--gold:#B7862B}
:root[data-theme="dark"]:not([data-skin]){--paper:#1D1E22;--card:#26282D;--ink:#E6E2DB;--soft:#9D988F;--matcha:#CFA67B;--mist:#34312D;--sakura:#E38C8C;--rose:#3B2828;--line:#3A3B41;--gold:#DDB662}
#skin{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:.85rem;color:var(--soft)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.65}
:lang(ja){font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--matcha);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font-size:1.75rem;font-weight:700}
.brand span{color:var(--soft)}
nav{display:flex;gap:4px;background:var(--mist);padding:4px;border-radius:14px}
nav{max-width:100%;overflow-x:auto}
nav button{border:0;background:transparent;color:var(--soft);font-weight:700;padding:9px 16px;border-radius:11px;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px}
h2{font-size:1.15rem;margin:0 0 14px}
.muted{color:var(--soft)}
.small{font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:1.7rem;font-weight:700;line-height:1.2}
.stat span{color:var(--soft);font-size:.88rem}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.field{margin-bottom:16px}
.field>label,.field>.lab{display:block;font-weight:700;margin-bottom:6px}
.range{display:flex;align-items:center;gap:8px}
select,input[type=number],input[type=search]{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px}
select{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--soft);padding:6px 14px;border-radius:999px}
.chip[aria-pressed="true"]{border-color:var(--matcha);background:var(--mist);color:var(--ink);font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:11px 13px}
.mode b{display:block}
.mode small{color:var(--soft)}
.mode[aria-pressed="true"]{border-color:var(--matcha);background:var(--mist)}
.go{width:100%;border:0;background:var(--matcha);color:var(--card);font-weight:700;font-size:1.1rem;padding:14px;border-radius:14px}
.go:disabled{opacity:.45;cursor:not-allowed}
.les{display:grid;grid-template-columns:3.2em 1fr 3.6em;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.les:last-child{border-bottom:0}
.meter{height:8px;background:var(--mist);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--matcha)}
.les .pct{text-align:right;color:var(--soft)}
.search{margin-top:16px}
.search input{width:100%}
.hit{padding:12px 0;border-bottom:1px solid var(--line)}
.hit:last-child{border-bottom:0}
/* quiz */
.qbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.qbar .left{display:flex;gap:10px;align-items:baseline}
.qbar .count{font-weight:700;font-size:1.15rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--sakura)}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:7px 13px}
.tags{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--mist);color:var(--soft)}
.star{border:0;background:transparent;font-size:1.4rem;line-height:1;color:var(--line);padding:0 4px}
.star.on{color:var(--gold)}
.passage{background:var(--paper);border-radius:14px;padding:16px 18px;margin-bottom:16px;font-size:1.15rem;line-height:2.3}
.passage rt{font-size:.55em;color:var(--soft)}
.passage.noruby rt{visibility:hidden}
.ptools{display:flex;gap:8px;margin:-6px 0 12px;flex-wrap:wrap}
.ask{color:var(--soft);margin-bottom:4px}
.prompt{font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prompt.big{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700}
.subp{font-size:1.2rem;color:var(--soft);margin-bottom:6px}
.say{border:0;background:var(--mist);border-radius:50%;width:38px;height:38px;font-size:1rem;flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-size:1.08rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--soft)}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--matcha);background:var(--mist);font-weight:700}
.opt.wrong{border-color:var(--sakura);background:var(--rose)}
.exp{margin-top:16px;border-left:4px solid var(--matcha);padding:10px 14px;background:var(--paper);border-radius:0 12px 12px 0}
.exp.bad{border-left-color:var(--sakura)}
.exp h3{margin:0 0 4px;font-size:1rem}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.qnav button{min-width:120px}
.primary{border:0;background:var(--ink);color:var(--paper);font-weight:700;padding:11px 18px;border-radius:12px}
.finish{border:0;background:var(--matcha);color:var(--card);font-weight:700;padding:11px 18px;border-radius:12px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.dots button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:.75rem;color:var(--soft);padding:0}
.dots button.cur{border-color:var(--ink);color:var(--ink);font-weight:700}
.dots button.ok{background:var(--mist);border-color:var(--matcha);color:var(--matcha)}
.dots button.no{background:var(--rose);border-color:var(--sakura);color:var(--sakura)}
.dots button.done{background:var(--mist)}
.score{text-align:center;padding:10px 0 20px}
.score b{display:block;font-size:4rem;font-weight:700;line-height:1.1;color:var(--matcha)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;text-align:center}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ans{color:var(--matcha);font-weight:700}
.empty{padding:30px 10px;text-align:center;color:var(--soft)}
.hide{display:none!important}
#wtest{margin-top:16px}
.nbpaper{--grid:color-mix(in srgb,var(--line) 55%,transparent);background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
.nbpaper .nbsheet{background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:12px}
.nbg{margin:18px 0 6px}
.nbg h3{display:inline-block;margin:0 0 4px;font-size:1.08rem;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--sakura) 28%,transparent) 58%);padding:0 4px}
.nbg .knote{margin:4px 0 8px}
.nbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));column-gap:26px}
.nbw{padding:9px 2px 10px;border-bottom:1px dashed var(--line);break-inside:avoid}
.nbh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.nbk{font-size:1.25rem;font-weight:500}
.nbj{font-size:1.05rem;color:var(--soft)}
.nbz{font-size:1rem}
.nbh .say{width:28px;height:28px;font-size:.75em}
.nblv{font-size:.7rem;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--soft)}
mark.y{background:color-mix(in srgb,#E9D44C 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
mark.b{background:color-mix(in srgb,#5AA9E6 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.nbw .ksent{font-size:.98rem;margin-top:3px}
.nbbrief .nbw .ksent,.nbbrief .nbw .kzh,.nbbrief .nbw .gloss{display:none}
.nbbrief .nbgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.nbbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px}
.legend{font-size:.82rem;color:var(--soft)}

u.hw{text-decoration:underline;text-decoration-color:var(--matcha);text-decoration-thickness:2px;text-underline-offset:6px}
.gloss{font-size:.85rem;color:var(--soft);margin-top:3px;line-height:1.7}
.gloss b{font-weight:500;color:var(--ink)}
.subh{font-size:1rem;color:var(--soft);margin:24px 0 2px;padding-top:12px;border-top:2px solid var(--line)}
.setb{border:1.5px solid var(--line);border-radius:14px;padding:12px 16px 4px;margin:16px 0;background:var(--paper)}
.setb h3{margin:0 0 6px;font-size:1.05rem;color:var(--matcha)}
.setb .tw.subw:last-child{border-bottom:0}
.vk{text-decoration:underline;text-decoration-color:var(--matcha);text-decoration-thickness:2px;text-underline-offset:5px}
sup.vn{color:var(--matcha);font-size:.55em;font-weight:700;margin-left:1px}
.gq{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line)}
.gq .prompt{font-size:1.15rem}
.gq .opts{margin-top:8px}
.abook{margin-top:18px;border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;background:var(--card)}
.abook h4{margin:0 0 6px;font-size:1.1rem}
.abook h5{margin:18px 0 6px;font-size:1rem;color:var(--matcha)}
.abq{padding:10px 0;border-bottom:1px dashed var(--line)}
.abq:last-of-type{border-bottom:0}
.abq .ok{color:var(--matcha);font-weight:700}.abq .ng{color:var(--sakura);font-weight:700}
.vlist{margin:0;padding-left:1.8em}.vlist li{padding:4px 0}
.vlist .say{width:26px;height:26px;font-size:.7em;vertical-align:middle}

#sync{color:var(--matcha);margin-left:4px}
.paper-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
.paper-h h2{margin:0;font-size:1.5rem}
.psec{margin-top:26px}
.psec>h3{font-size:1.15rem;margin:0 0 4px;padding:6px 12px;background:var(--mist);border-radius:10px}
.pinst{color:var(--soft);font-size:.92rem;margin:8px 2px 4px}
.pq{padding:14px 2px;border-bottom:1px solid var(--line)}
.pq .qt{display:flex;gap:10px;align-items:baseline;font-size:1.1rem;flex-wrap:wrap}
.pq .qn{font-weight:700;min-width:2.2em;color:var(--soft)}
.pq u{text-underline-offset:5px;text-decoration-thickness:2px;font-size:1.25rem;font-weight:700}
.popts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 0 2.2em}
.popt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;text-align:left;font-size:1rem;display:flex;gap:8px}
.popt .k{color:var(--soft);font-weight:700}
.popt.sel{border-color:var(--ink);background:var(--paper);font-weight:700}
.popt.right{border-color:var(--matcha);background:var(--mist);font-weight:700}
.popt.wrong{border-color:var(--sakura);background:var(--rose)}
.pexp{margin:8px 0 0 2.2em;font-size:.92rem;border-left:3px solid var(--sakura);padding:4px 10px;background:var(--paper);border-radius:0 8px 8px 0}
.pscore{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.pscore .stat b{font-size:1.5rem}
.pfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:24px}
@media (max-width:760px){.popts{grid-template-columns:1fr 1fr;margin-left:0}.pexp{margin-left:0}.pscore{grid-template-columns:1fr 1fr}}

.kwrap{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.toc2 button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:7px 10px;font-size:.9rem}
.toc2 button.on{background:var(--mist);font-weight:700}
.toc2 .ck{color:var(--matcha);font-weight:700}
.bkhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.bkhead h2{margin:0;font-size:1.4rem}
.bk{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.bk:last-child{border-bottom:0}
.bkk{text-align:center}
.kbig{font-size:4.2rem;line-height:1;width:1.45em;height:1.45em;margin:0 auto 8px;display:grid;place-items:center;border:2px solid var(--matcha);border-radius:14px;background:var(--paper)}
.kmeta{font-size:.82rem;line-height:1.7;color:var(--soft)}
.kmeta b{font-weight:500;color:var(--ink)}
.no{font-size:.8rem;color:var(--soft);font-variant-numeric:tabular-nums}
.kword{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kword .w{font-size:1.7rem;font-weight:700}
.kword .r{font-size:1.1rem;color:var(--soft)}
.kword .m{font-size:1.08rem}
.kword .say{align-self:center;width:32px;height:32px;font-size:.85rem}
.ksent{font-size:1.15rem;line-height:2.3;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ksent rt{font-size:.55em;color:var(--soft)}
.ksent .say{width:30px;height:30px;font-size:.8rem}
.kzh{color:var(--soft);font-size:.95rem;margin-top:-2px}
.knote{margin-top:8px;font-size:.92rem;padding-left:10px;border-left:3px solid var(--gold)}
.relist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:4px}
.relist li{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:5px 10px;background:var(--paper);border-radius:10px}
.relist .w{font-weight:500;font-size:1.05rem}
.relist .r{color:var(--soft)}
.relist .say{width:28px;height:28px;font-size:.75rem}
.toc2 .cat{font-size:.8rem;color:var(--soft);margin:8px 10px 2px}
.toc2 button:disabled{color:var(--line);cursor:default}
.toc2 button:disabled span:last-child{font-size:.75rem}
.ttip{margin:16px 0 0;background:var(--paper);border-radius:12px;padding:10px 14px;font-size:.95rem}
.tw{display:grid;grid-template-columns:2.2em 1fr;gap:4px 10px;padding:16px 0;border-bottom:1px solid var(--line)}
.tw:last-child{border-bottom:0}
.tw .no{padding-top:.55em}
.kchip{font-size:.85rem;padding:0 8px;border-radius:6px;background:var(--mist);color:var(--ink);align-self:center}
.tw.subw{padding:8px 0 8px 0;border-bottom:1px dashed var(--line)}
.tw.subw .w{font-size:1.2rem}
.tw.subw .kword{gap:8px}
.lvl{font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--soft);align-self:center}
.hr .rd,.hr .ksent rt{filter:blur(6px);cursor:pointer;transition:filter .15s}
.hr .rd.show,.hr .ksent.show rt{filter:none}
@media (max-width:760px){.kwrap{grid-template-columns:1fr}.kwrap>aside{order:2}.bk{grid-template-columns:1fr;gap:10px}.bkk{display:flex;gap:14px;align-items:center;text-align:left}.kbig{margin:0;font-size:3.2rem}.relist li{grid-template-columns:auto 1fr auto}.relist .r{grid-column:1/-1;grid-row:2;margin-top:-4px}}

.learn{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:14px;padding:14px;max-height:calc(100vh - 28px);overflow:auto}
.side .lab{font-weight:700;font-size:.88rem;color:var(--soft);margin:4px 4px 6px}
.lessons{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.lessons button{text-align:left;border:0;background:transparent;border-radius:10px;padding:7px 10px;font-size:.92rem;color:var(--ink)}
.lessons button span{color:var(--soft);margin-right:6px}
.lessons button.on{background:var(--mist);font-weight:700}
.side .chips{gap:6px}
.side .chip{padding:4px 11px}
.lhead{margin-bottom:16px}
.lhead h2{font-size:1.5rem;margin:0 0 6px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.85rem;padding:3px 11px;border-radius:999px;background:var(--mist);color:var(--ink);text-decoration:none}
.note{margin-bottom:16px}
.note h3{font-size:1.2rem;margin:0 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.note h3 small{font-weight:400;color:var(--soft);font-size:.85rem}
.pat{display:inline-block;background:var(--paper);border:1.5px solid var(--matcha);border-radius:10px;padding:6px 14px;font-size:1.15rem;font-weight:500;margin-bottom:10px}
.ex{list-style:none;padding:0;margin:10px 0 0}
.ex li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.ex .say{width:32px;height:32px;font-size:.85rem;margin-top:2px}
.ex .jp{font-size:1.12rem}
.ex .zh{color:var(--soft);font-size:.92rem}
.tip{margin-top:12px;background:var(--rose);border-radius:12px;padding:9px 13px;font-size:.95rem}
.tip b{color:var(--sakura)}
.extb{margin-top:12px;border:1.5px dashed var(--gold);border-radius:14px;padding:12px 14px}
.extb h4{margin:0 0 4px;color:var(--gold);font-size:.98rem}
.tblw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;min-width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap}
th{background:var(--mist);font-weight:700}
.lbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.linkbtn{border:0;background:transparent;color:var(--matcha);text-decoration:underline;padding:0;font-size:.9rem}
@media (max-width:760px){
  nav{width:100%}
  nav button{padding:8px 10px;font-size:.9rem;flex:1}
  .learn{grid-template-columns:1fr}
  .side{position:static;max-height:none}

 ex:[["コーヒーを 飲みます。","喝咖啡。"],["新聞を 読みます。","看報紙。"]],
 tip:"「を」唸「o」。",
 ext:{t:"經過的地方",exp:"「を」也可以表示經過、穿越的場所。",ex:[["公園を 歩きます。","在公園裡散步。"]]}},
{l:5,t:"動詞否定形",tag:[],pat:"～ます → ～ません",
 exp:"把「ます」換成「ません」，就是現在或未來的否定。",
 ex:[["お酒を 飲みません。","不喝酒。"],["明日は 働きません。","明天不工作。"]]},
{l:5,t:"動詞過去形",tag:[],pat:"～ました ／ ～ませんでした",
 exp:"過去肯定用「ました」，過去否定用「ませんでした」。",
 ex:[["昨日 本を 読みました。","昨天看了書。"],["昨日は 勉強しませんでした。","昨天沒有讀書。"]],
 tbl:[["","肯定","否定"],["現在／未來","食べます","食べません"],["過去","食べました","食べませんでした"]]},
{l:5,t:"副詞的用法",tag:[],pat:"副詞 ＋ 動詞",
 exp:"表示頻率的副詞放在動詞前面。其中「あまり」和「ぜんぜん」一定要接否定。",
 ex:[["いつも 7時に 起きます。","總是7點起床。"],["よく 映画を 見ます。","常常看電影。"],["あまり テレビを 見ません。","不太看電視。"],["お酒は ぜんぜん 飲みません。","完全不喝酒。"]],
 tbl:[["いつも","よく","ときどき","あまり～ない","ぜんぜん～ない"],["總是","常常","有時候","不太","完全不"]]},

/* ---------- 第6課 ---------- */
{l:6,t:"な形容詞用法",tag:[],pat:"静かです ／ 静かな 名詞",
 exp:"な形容詞修飾名詞時要加「な」；否定是「～じゃありません」。",
 ex:[["この 公園は 静かです。","這個公園很安靜。"],["静かな 公園です。","是個安靜的公園。"],["この 町は にぎやかじゃ ありません。","這個城鎮不熱鬧。"]],
 tip:"「きれい」「きらい」結尾是い，但它們是な形容詞，要特別記。"},
{l:6,t:"い形容詞用法",tag:[],pat:"高いです ／ 高い 名詞",
 exp:"い形容詞直接接名詞；否定是把最後的「い」變成「くないです」。",
 ex:[["この かばんは 高いです。","這個包包很貴。"],["高い かばんです。","是很貴的包包。"],["あまり おいしくないです。","不太好吃。"]],
 tip:"「いい」是特例，否定是「よくないです」。"},
{l:6,t:"希望「たい」的用法",tag:[],pat:"ます形去ます ＋ たいです",
 exp:"表示自己想做某事。否定是「～たくないです」。",
 ex:[["日本へ 行きたいです。","我想去日本。"],["新しい パソコンが 買いたいです。","我想買新電腦。"],["今日は 何も 食べたくないです。","今天什麼都不想吃。"]],
 tip:"「たい」用在自己或問對方，不直接用來說別人想做什麼。受詞的「を」可以換成「が」。",
 ext:{t:"想要某個東西：ほしい",exp:"想要的是東西（名詞）時，用「～が ほしいです」。",ex:[["新しい 靴が ほしいです。","我想要新鞋子。"]]}},

/* ---------- 第7課 ---------- */
{l:7,t:"助詞「が」的用法",tag:["が"],pat:"A は B が 好きです",
 exp:"「好き、嫌い、上手、下手、分かります」這類表示喜好、能力的詞，對象用「が」。",
 ex:[["わたしは 音楽が 好きです。","我喜歡音樂。"],["田中さんは 日本語が 上手です。","田中先生日文很好。"],["英語が 分かりますか。","你懂英文嗎？"]],
 tip:"這裡不能用「を」。"},
{l:7,t:"理由的說法",tag:["から"],pat:"理由 から、結果",
 exp:"「から」接在句子後面表示原因，意思是「因為…所以…」。",
 ex:[["時間が ありませんから、行きません。","因為沒時間，所以不去。"],["暑いですから、窓を 開けます。","因為很熱，所以開窗。"]],
 ext:{t:"問理由",exp:"問「為什麼」用「どうして」，回答時句尾加「からです」。",ex:[["どうして 来ませんでしたか。","為什麼沒來？"],["忙しかったからです。","因為很忙。"]]}},
{l:7,t:"存在文 (1)：助詞「に」②",tag:["に"],pat:"地點 に 物 が あります ／ 人 が います",
 exp:"說「某處有某物」。東西、植物用「あります」；人、動物用「います」。",
 ex:[["机の 上に 本が あります。","桌上有書。"],["公園に 子どもが います。","公園裡有小孩。"]],
 tip:"存在的地點用「に」，不是「で」。"},
{l:7,t:"存在文 (2)",tag:["は","に"],pat:"物 は 地點 に あります",
 exp:"當你已經知道是哪個東西、想問它在哪裡時，把東西放前面當主題。",
 ex:[["猫は ベッドの 下に います。","貓在床底下。"],["トイレは どこに ありますか。","廁所在哪裡？"]],
 ext:{t:"位置詞",exp:"位置詞前面加「名詞＋の」：机の上、箱の中。",ex:[["駅の 前に 銀行が あります。","車站前面有銀行。"],["わたしの 隣に 田中さんが います。","田中先生在我旁邊。"]]},
 tbl:[["上","下","中","前","後ろ","隣","そば"],["上面","下面","裡面","前面","後面","旁邊（並排）","附近"]]},

/* ---------- 第8課 ---------- */
{l:8,t:"副詞「もう」的用法",tag:[],pat:"もう ～ました ／ まだです",
 exp:"「もう」＋過去式是「已經…了」。還沒做的話回答「いいえ、まだです」。",
 ex:[["もう 昼ご飯を 食べましたか。","已經吃午餐了嗎？"],["はい、もう 食べました。","是的，已經吃了。"],["いいえ、まだです。","不，還沒。"]],
 tip:"回答「還沒」時不要說「まだ食べませんでした」，要說「まだです」或「まだ食べていません」。"},
{l:8,t:"助詞「に」③ 動作的對象",tag:["に"],pat:"人 に あげます／もらいます／教えます",
 exp:"給、送、教、打電話的對象用「に」。「もらいます」的「に」表示從誰那裡得到。",
 ex:[["友達に 花を あげました。","送花給朋友。"],["先生に 本を もらいました。","從老師那裡拿到書。"],["母に 電話を かけます。","打電話給媽媽。"]],
 tip:"「もらいます」的「に」也可以換成「から」。"},
{l:8,t:"授受表現",tag:["に"],pat:"あげます ／ もらいます ／ くれます",
 exp:"「あげます」是我給別人；「もらいます」是我從別人那裡得到；「くれます」是別人給我（或我的家人）。",
 ex:[["わたしは 田中さんに プレゼントを あげました。","我送禮物給田中先生。"],["わたしは 田中さんに プレゼントを もらいました。","我從田中先生那裡收到禮物。"],["田中さんは わたしに プレゼントを くれました。","田中先生送我禮物。"]],
 tip:"別人給「我」時不能用「あげます」，一定要用「くれます」。"},

/* ---------- 第9課 ---------- */
{l:9,t:"量詞的用法",tag:[],pat:"數字 ＋ 量詞",
 exp:"日文數東西要依照東西的形狀選量詞。一般的東西用「～つ」。",
 ex:[["りんごを 三つ 買いました。","買了三個蘋果。"],["切手を 5枚 ください。","請給我5張郵票。"],["学生が 二人 います。","有兩個學生。"]],
 tbl:[["量詞","用在","例子"],["～つ","一般東西","一つ、二つ、三つ"],["～枚","薄的：紙、郵票、襯衫","1枚、2枚"],["～本","細長：筆、瓶子、傘","1本（いっぽん）、3本（さんぼん）"],["～冊","書、筆記本","1冊（いっさつ）"],["～人","人","一人（ひとり）、二人（ふたり）、三人"],["～回","次數","1回（いっかい）"]],
 tip:"「一人、二人」要唸「ひとり、ふたり」，三人以後才是「～にん」。"},
{l:9,t:"助詞「に」④ 頻率",tag:["に"],pat:"期間 に ＋ 次數",
 exp:"「一段時間裡做幾次」，期間後面加「に」。",
 ex:[["一週間に 2回 日本語を 勉強します。","一週讀兩次日文。"],["一日に 3回 ご飯を 食べます。","一天吃三餐。"]]},
{l:9,t:"量詞接助詞的用法",tag:["を","が"],pat:"名詞 を ＋ 量詞 ＋ 動詞",
 exp:"量詞通常放在「名詞＋助詞」的後面、動詞的前面，量詞本身不加助詞。",
 ex:[["ビールを 2本 飲みました。","喝了兩瓶啤酒。"],["教室に 学生が 10人 います。","教室裡有10個學生。"]],
 ext:{t:"問數量",exp:"問幾個用「いくつ」，問價錢用「いくら」。",ex:[["りんごを いくつ 買いますか。","要買幾個蘋果？"],["これは いくらですか。","這個多少錢？"]]}},

/* ---------- 第10課 ---------- */
{l:10,t:"名詞：過去形",tag:[],pat:"名詞 でした ／ 名詞 じゃありませんでした",
 exp:"把「です」變成「でした」就是過去。",
 ex:[["昨日は 雨でした。","昨天下雨。"],["昨日は 休みじゃ ありませんでした。","昨天不是休假。"]]},
{l:10,t:"な形容詞：過去形",tag:[],pat:"静か でした ／ 静か じゃありませんでした",
 exp:"跟名詞的變化完全一樣。",
 ex:[["先週は ひまでした。","上週很閒。"],["パーティーは にぎやかじゃ ありませんでした。","派對不熱鬧。"]]},
{l:10,t:"い形容詞：過去形",tag:[],pat:"高かったです ／ 高くなかったです",
 exp:"去掉最後的「い」，加「かったです」是過去肯定；加「くなかったです」是過去否定。",
 ex:[["旅行は 楽しかったです。","旅行很開心。"],["テストは 難しくなかったです。","考試不難。"]],
 tip:"不能說「高いでした」。「いい」的過去是「よかったです」、「よくなかったです」。"},
{l:10,t:"現在形・過去形總整理",tag:[],
 exp:"把四種詞的變化一次整理起來，考試很常考。",
 tbl:[["","現在肯定","現在否定","過去肯定","過去否定"],["名詞","雨です","雨じゃありません","雨でした","雨じゃありませんでした"],["な形","ひまです","ひまじゃありません","ひまでした","ひまじゃありませんでした"],["い形","高いです","高くないです","高かったです","高くなかったです"],["いい","いいです","よくないです","よかったです","よくなかったです"],["動詞","食べます","食べません","食べました","食べませんでした"]]},

/* ---------- 第11課 ---------- */
{l:11,t:"比較文 (1)：助詞「より」",tag:["より"],pat:"A は B より 形容詞",
 exp:"「A 比 B 更…」。「より」接在被比較的那個東西後面。",
 ex:[["台湾は 日本より 暑いです。","台灣比日本熱。"],["電車は バスより 速いです。","電車比公車快。"]]},
{l:11,t:"比較文 (2)：助詞「ほど」",tag:["ほど"],pat:"A は B ほど 形容詞否定",
 exp:"「A 沒有 B 那麼…」，後面一定要接否定。",
 ex:[["電車は 飛行機ほど 速くないです。","電車沒有飛機那麼快。"],["今日は 昨日ほど 寒くないです。","今天沒有昨天那麼冷。"]]},
{l:11,t:"比較文 (3)：二選一",tag:["と","の"],pat:"A と B と どちらが ～ですか ／ A の 方が ～です",
 exp:"兩個東西比較時問「どちら」，回答用「～の方が」。",
 ex:[["コーヒーと お茶と どちらが 好きですか。","咖啡和茶你比較喜歡哪個？"],["お茶の 方が 好きです。","比較喜歡茶。"]],
 ext:{t:"一樣",exp:"兩個差不多時可以說「どちらも」。",ex:[["どちらも 好きです。","兩個都喜歡。"]]}},
{l:11,t:"比較文 (4)：最高級",tag:["で"],pat:"～の 中で 何／だれ／どこ が 一番 ～ですか",
 exp:"三個以上的東西比較，問「哪一個最…」。",
 ex:[["果物の 中で 何が 一番 好きですか。","水果中你最喜歡什麼？"],["りんごが 一番 好きです。","最喜歡蘋果。"],["季節の 中で 冬が 一番 好きです。","四季中最喜歡冬天。"]],
 tip:"問人用「だれ」、問地方用「どこ」、問東西用「何」。"},

/* ---------- 第12課 ---------- */
{l:12,t:"助詞「に」⑤ 目的",tag:["に"],pat:"ます形去ます ＋ に ＋ 行きます／来ます",
 exp:"表示去某地的目的：「去做…」。",
 ex:[["デパートへ かばんを 買いに 行きます。","去百貨公司買包包。"],["日本へ 日本語を 勉強しに 来ました。","來日本學日文。"]],
 ext:{t:"名詞＋に",exp:"「勉強、買い物、食事」這類名詞可以直接加「に」。",ex:[["買い物に 行きます。","去買東西。"],["食事に 行きませんか。","要不要去吃飯？"]]}},
{l:12,t:"提案的說法",tag:[],pat:"～ましょうか",
 exp:"主動提出要幫對方做某事：「我來…吧？」",
 ex:[["荷物を 持ちましょうか。","我幫你拿行李吧？"],["窓を 開けましょうか。","要我開窗嗎？"],["ええ、お願いします。","好，麻煩你了。"]],
 tip:"「～ましょう」是邀對方一起做；「～ましょうか」多半是我主動幫忙或提議。"},
{l:12,t:"同時進行的表現",tag:[],pat:"ます形去ます ＋ ながら",
 exp:"「一邊…一邊…」，主要的動作放在後面。",
 ex:[["音楽を 聞きながら 勉強します。","一邊聽音樂一邊讀書。"],["歩きながら 話しましょう。","邊走邊聊吧。"]],
 tip:"兩個動作必須是同一個人做。"},

/* ---------- 第13課 ---------- */
{l:13,t:"動詞分成三類",tag:[],
 exp:"日文動詞依照變化方式分成三類，之後所有的て形、ない形、た形都要先知道是哪一類。",
 tbl:[["類別","判斷方法（看ます形）","例子"],["第I類","ます前面是い段音","行きます、飲みます、帰ります"],["第II類","ます前面是え段音（＋少數い段）","食べます、寝ます、見ます、起きます"],["第III類","只有兩個","します（勉強します等）、来ます"]]},
{l:13,t:"如何判斷是哪一類動詞",tag:[],
 exp:"先看ます前面的字：え段音幾乎都是第II類；い段音大多是第I類，但有些常用字是第II類，只能背起來。",
 ex:[["食べます → べ是え段 → 第II類","（判斷例）"],["飲みます → み是い段 → 第I類","（判斷例）"]],
 tbl:[["要特別記的字","類別"],["見ます、起きます、借ります、います、着ます","第II類（い段卻是II類）"],["帰ります、走ります、入ります、知ります","第I類（看起來像II類）"]],
 tip:"「～します」前面有名詞的（勉強します、宿題をします、興奮します）都是第III類。"},

/* ---------- 第14課 ---------- */
{l:14,t:"て形的做法",tag:[],
 exp:"第14課開始的句型全部都用て形，這張表一定要熟。第I類看辭書形最後一個字來變。",
 tbl:[["類別","規則","例子"],["第I類","う・つ・る → って","買う→買って、待つ→待って、帰る→帰って"],["第I類","む・ぶ・ぬ → んで","飲む→飲んで、遊ぶ→遊んで、死ぬ→死んで"],["第I類","く → いて／ぐ → いで","書く→書いて、泳ぐ→泳いで"],["第I類","す → して","話す→話して"],["例外","行く → 行って","行きます→行って"],["第II類","ます → て","食べます→食べて、見ます→見て"],["第III類","します→して、来ます→来て","勉強して、来て"]]},
{l:14,t:"要求的說法 ①",tag:[],pat:"て形 ＋ ください",
 exp:"禮貌地請對方做某事：「請…」。",
 ex:[["ちょっと 待って ください。","請稍等。"],["ここに 名前を 書いて ください。","請在這裡寫名字。"]]},
{l:14,t:"許可的說法",tag:[],pat:"て形 ＋ も いいですか",
 exp:"問「可以…嗎？」。可以的話回答「はい、どうぞ」；不行的話常說「すみません、ちょっと…」。",
 ex:[["写真を 撮っても いいですか。","可以拍照嗎？"],["はい、どうぞ。","可以，請。"],["窓を 開けても いいですか。","可以開窗嗎？"]]},
{l:14,t:"現在進行的說法",tag:[],pat:"て形 ＋ います",
 exp:"表示動作正在進行：「正在…」。",
 ex:[["今 雨が 降って います。","現在正在下雨。"],["田中さんは 新聞を 読んで います。","田中先生正在看報紙。"]],
 ext:{t:"持續的狀態",exp:"「～ています」也能表示某個狀態一直持續著。",ex:[["姉は 結婚して います。","姊姊已經結婚了（現在是已婚狀態）。"],["東京に 住んで います。","住在東京。"]]}},
{l:14,t:"試行的說法",tag:[],pat:"て形 ＋ みます",
 exp:"「試著做看看」。",
 ex:[["この 服を 着て みます。","試穿這件衣服看看。"],["日本の 料理を 食べて みたいです。","想吃吃看日本料理。"]]},

/* ---------- 第15課 ---------- */
{l:15,t:"動作順序的說法 ①：～てから",tag:["から"],pat:"動作1（て形）＋ から、動作2",
 exp:"強調「做完動作1之後，才做動作2」。",
 ex:[["宿題を して から、テレビを 見ます。","寫完功課之後再看電視。"],["手を 洗って から、ご飯を 食べます。","洗完手再吃飯。"]],
 ext:{t:"～て、～て、～ます",exp:"不需要特別強調先後，只是依序說好幾個動作時，用て形一直接下去。",ex:[["朝 起きて、顔を 洗って、学校へ 行きます。","早上起床、洗臉，然後去學校。"]]}},
{l:15,t:"遺憾的說法：～てしまいました",tag:[],pat:"て形 ＋ しまいました",
 exp:"表示不小心做了、結果很可惜。常和「忘れます、落とします、失くします」一起用。",
 ex:[["財布を 落として しまいました。","不小心把錢包弄丟了。"],["宿題を 忘れて しまいました。","不小心忘了功課。"],["傘を 失くして しまいました。","把傘弄丟了。"]],
 ext:{t:"完全做完＆口語說法",exp:"「～てしまいます」也能表示「全部做完」。口語會縮成「～ちゃった／～じゃった」。",ex:[["ケーキを 全部 食べて しまいました。","把蛋糕全部吃完了。"],["財布、落としちゃった！","錢包掉了啦！"]]}},
{l:15,t:"形容詞・名詞的連接",tag:["で"],pat:"い形：～くて ／ な形・名詞：～で",
 exp:"要把兩個形容詞或句子連起來時使用，意思是「又…又…」。",
 ex:[["この 部屋は 広くて、きれいです。","這個房間又寬敞又漂亮。"],["田中さんは 親切で、頭が いいです。","田中先生很親切，又聰明。"],["林さんは 台湾人で、学生です。","林同學是台灣人，是學生。"]],
 tip:"「いい」要變成「よくて」。"},
{l:15,t:"動作和移動：～てきます",tag:[],pat:"て形 ＋ きます",

<script>
(function(){
const B=window.BANK;
const TYPES=[["vocab","課本單字"],["kanji","漢字"],["conj","動詞變化"],["grammar","文法"],["reading","閱讀"],["nb","日檢單字"]];
const TN=Object.fromEntries(TYPES);
const MODES=[["practice","精熟練習","隨機出題，答完立刻看解析"],["seq","依序練習","照課程順序出題"],["exam","計時模擬考","每題 60 秒，交卷才公布答案"],["wrong","只練錯題","從答錯過的題目出題"]];
const GN={I:"第I類",II:"第II類",III:"第III類"};
const KEY="jpquiz-v1";

try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(S,JSON.parse(s));}catch(e){}
const save=()=>{S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.__cloudSave)window.__cloudSave()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ruby=t=>esc(t).replace(/\[([^|\]]+)\|([^\]]+)\]/g,"<ruby>$1<rt>$2</rt></ruby>").replace(/\n/g,"<br>");
const secLabel=q=>q.l?"第"+q.l+"課":q.type==="nb"?esc("N"+q.nlv+"・"+((NB.find(c=>"nb:"+c.id===q.sec)||{}).t||"")):esc((q.sec||"").replace(/^t:/,"").replace(/^b:/,"").replace(/^x:/,""));
const nbPlain=t=>t.replace(/[{}<>]/g,"");
const plain=t=>t.replace(/\[([^|\]]+)\|([^\]]+)\]/g,"$2");
const JA=/[\u3040-\u30ff]/;
const la=t=>JA.test(t)?' lang="ja"':"";
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- 題庫 ---------- */
const V=B.vocab.map(a=>({l:a[0],kana:a[1],kanji:a[2],mean:a[3],acc:a[4]==null?null:a[4],dict:a[5]||null,te:a[6]||null,g:a[7]||null}));
const EDAN="えけげせぜてでねへべぺめれ";
function gExp(v){
  const b=v.kana.replace(/ます$/,"").slice(-1);
  if(v.g==="III")return `「${v.kanji}」是第III類（します・来ます這類不規則動詞），辭書形「${v.dict}」。`;
  if(v.g==="II")return EDAN.includes(b)?`ます前面是え段音「${b}」，屬於第II類。辭書形「${v.dict}」。`:`ます前面是い段音「${b}」，看起來像第I類，但這個字屬於第II類，要特別記。辭書形「${v.dict}」。`;
  return `ます前面是い段音「${b}」，屬於第I類。辭書形「${v.dict}」。`;
}
function teExp(v){
  if(v.g==="III")return `第III類：する→して、来る→来て。「${v.kanji}」→「${v.te}」。`;
  if(v.g==="II")return `第II類：ます形去掉ます＋て。「${v.kanji}」→「${v.te}」。`;
  if(v.dict==="行く")return "「行く」是例外：く結尾，但て形是「行って」。";
  const e=v.dict.slice(-1);
  const r={"う":"う・つ・る → って","つ":"う・つ・る → って","る":"う・つ・る → って","む":"む・ぶ・ぬ → んで","ぶ":"む・ぶ・ぬ → んで","ぬ":"む・ぶ・ぬ → んで","く":"く → いて","ぐ":"ぐ → いで","す":"す → して"}[e]||"";
  return `第I類，辭書形「${v.dict}」以「${e}」結尾：${r}。所以是「${v.te}」。`;
}
function teWrong(v){
  const stem=v.kanji.replace(/ます$/,""),base=v.dict.slice(0,-1);
  const c=v.g==="III"?[stem+"って",v.dict+"て",stem+"んで",stem+"いて"]:[stem+"て",base+"って",base+"んで",base+"いて",base+"して",base+"いで"];
  return shuffle([...new Set(c)].filter(x=>x!==v.te)).slice(0,3);
}
function vocabWrong(v,field){
  const pos=w=>w.dict?"v":(/い$/.test(w.kana)&&!w.dict?"a":"n");
  const cand=V.filter(w=>w[field]!==v[field]&&(field!=="kana"||w.kanji!==w.kana)).map(w=>({w,s:Math.random()+(Math.abs(w.l-v.l)<=3?0:.8)+(pos(w)===pos(v)?0:.6)})).sort((a,b)=>a.s-b.s);
  const out=[];for(const c of cand){const x=c.w[field];if(!out.includes(x))out.push(x);if(out.length===3)break}
  return out;
}
const ALL=[];
V.forEach((v,i)=>{
  const k="v:"+v.kanji+"|"+v.kana,base={type:"vocab",l:v.l,v,say:v.kana,ord:i};
  const sub=v.kanji!==v.kana?v.kana:"";
  ALL.push(Object.assign({},base,{id:k+":m",ask:"這個字是什麼意思？",jp:v.kanji,sub,ans:v.mean,gen:()=>vocabWrong(v,"mean"),exp:`${v.kanji}（${v.kana}）＝ ${v.mean}`}));
  if(sub)ALL.push(Object.assign({},base,{id:k+":r",ask:"讀音是？",jp:v.kanji,ans:v.kana,gen:()=>vocabWrong(v,"kana"),exp:`${v.kanji} 唸作「${v.kana}」，意思是${v.mean}。`}));
  ALL.push(Object.assign({},base,{id:k+":j",ask:"日文怎麼說？",zhp:v.mean,ans:v.kanji,gen:()=>vocabWrong(v,"kanji"),exp:`${v.mean} ＝ ${v.kanji}${sub?"（"+sub+"）":""}`}));
  if(v.g){
    ALL.push({id:k+":g",type:"conj",l:Math.max(v.l,13),v,say:v.kana,ord:1000+i,ask:"這是第幾類動詞？",jp:v.kanji,sub,ans:GN[v.g],opts:["第I類","第II類","第III類"],fixed:true,exp:gExp(v)});
    ALL.push({id:k+":t",type:"conj",l:Math.max(v.l,14),v,say:v.kana,ord:2000+i,ask:"て形是？",jp:v.kanji,sub,ans:v.te,gen:()=>teWrong(v),exp:teExp(v)});
  }

/* ---------- 考卷 ---------- */
/* 考卷讀音題：做出像真的考試一樣「很像」的錯誤選項 */
const DK={"か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご","さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ","た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど","は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"};
const DKR=Object.fromEntries(Object.entries(DK).map(([a,b])=>[b,a]));
const OROW="おこそとのほもよろごぞどぼょ";
function mutations(r){
  const out=new Set(),ch=[...r],pre=r.startsWith("〜")?1:0;
  ch.forEach((c,i)=>{if(i<pre)return;const t=DK[c]||DKR[c];if(t&&c!=="ぢ"&&t!=="ぢ"&&t!=="づ"&&c!=="づ"){const x=ch.slice();x[i]=t;out.add(x.join(""))}});
  ch.forEach((c,i)=>{if(c==="っ"){const x=ch.slice();x.splice(i,1);out.add(x.join(""))}});
  ch.forEach((c,i)=>{if(i>pre&&i<ch.length-1&&ch[i-1]!=="っ"&&ch[i-1]!=="ん"&&"かきくけこさしすせそたちつてとぱぴぷぺぽ".includes(c)){const x=ch.slice();x.splice(i,0,"っ");out.add(x.join(""))}});
  ch.forEach((c,i)=>{if(c==="う"&&i>0&&OROW.includes(ch[i-1].slice(-1))){const x=ch.slice();x.splice(i,1);out.add(x.join(""))}
    else if(OROW.includes(c)&&ch[i+1]!=="う"&&i<ch.length-1){const x=ch.slice();x.splice(i+1,0,"う");out.add(x.join(""))}});
  ch.forEach((c,i)=>{const sw={"ゅ":"ょ","ょ":"ゅ","ゃ":"ょ"}[c];if(sw){const x=ch.slice();x[i]=sw;out.add(x.join(""))}});
  out.delete(r);return [...out];
}
function simReadings(r){
  const m=shuffle(mutations(r)).slice(0,2);
  const pool=[...new Set(ALL.filter(q=>q.id.endsWith(":r")).map(q=>q.ans))].filter(x=>x!==r&&!m.includes(x)&&(x.startsWith("〜")===r.startsWith("〜")));
  const sc=x=>Math.abs(x.length-r.length)*2+([...x].filter(c=>r.includes(c)).length?0:3)+(x[0]===r[0]?-1:0)+Math.random()*2;
  const real=pool.map(x=>[x,sc(x)]).sort((a,b)=>a[1]-b[1]).slice(0,3-m.length).map(x=>x[0]);
  return m.concat(real).slice(0,3);
}

let paper=null,pcfg={from:1,to:15,nv:20,ng:15,nr:2},ptick=null,onlyWrong=false;
function buildPaper(){
  const inR=q=>q.l!=null&&q.l>=pcfg.from&&q.l<=pcfg.to;
  const voc=ALL.filter(q=>q.type==="vocab"&&inR(q));
  const rd=shuffle(voc.filter(q=>q.id.endsWith(":r")));
  const usedW=new Set();const pick=(arr,n)=>{const out=[];for(const q of arr){if(out.length>=n)break;if(usedW.has(q.jp||q.zhp))continue;usedW.add(q.jp||q.zhp);out.push(q)}return out};
  const nr=Math.ceil(pcfg.nv/2);
  const s1=pick(rd,nr),s2=pick(shuffle(voc.filter(q=>q.id.endsWith(":m")||q.id.endsWith(":j"))),pcfg.nv-s1.length);
  const gram=shuffle(ALL.filter(q=>(q.type==="grammar"||q.type==="conj")&&inR(q))).slice(0,pcfg.ng).sort((a,b)=>(a.type==="conj")-(b.type==="conj"));
  const ps=B.reading.filter(p=>p.l>=pcfg.from&&p.l<=pcfg.to);
  const pp=(ps.length?ps:B.reading.filter(p=>p.l<=pcfg.to)).slice(-pcfg.nr*2);
  const chosen=shuffle(pp).slice(0,pcfg.nr).sort((a,b)=>a.l-b.l);
  const rq=chosen.flatMap(p=>ALL.filter(q=>q.passage===p));
  const secs=[
    {t:"第一部分　文字・語彙",parts:[{inst:"問題1　畫底線的字怎麼唸？請選出正確的讀音。",items:s1},{inst:"問題2　請選出正確的意思。",items:s2}]},
    {t:"第二部分　文法",parts:[{inst:"問題3　請選出最適合放進（　）的答案。",items:gram.filter(q=>q.type==="grammar")},{inst:"問題4　動詞變化：請選出正確的答案。",items:gram.filter(q=>q.type==="conj")}]},
    {t:"第三部分　讀解",parts:[{inst:"問題5　請讀文章，回答問題。",items:rq}]}
  ];
  secs.forEach(sc=>{sc.parts=sc.parts.filter(pt=>pt.items.length);sc.parts.forEach(pt=>pt.items=pt.items.map(inst))});
  secs[0].parts.forEach(pt=>pt.items.forEach(it=>{if(it.q.id.endsWith(":r"))it.opts=shuffle([it.q.ans].concat(simReadings(it.q.ans)))}));
  paper={secs:secs.filter(sc=>sc.parts.length),t0:Date.now(),done:false,from:pcfg.from,to:pcfg.to};
  onlyWrong=false;
  clearInterval(ptick);ptick=setInterval(()=>{const e=document.getElementById("ptime");if(e&&paper&&!paper.done)e.textContent=fmt(Math.floor((Date.now()-paper.t0)/1000))},1000);
}
function pAll(){return paper.secs.flatMap(sc=>sc.parts.flatMap(pt=>pt.items))}
function renderPaper(){
  const root=document.getElementById("v-paper");
  if(!paper){
    const opt=v=>B.lessons.map(L=>`<option value="${L.n}" ${L.n===v?"selected":""}>第${L.n}課 ${esc(L.t)}</option>`).join("");
    root.innerHTML=`<div class="panel" style="max-width:640px;margin:0 auto"><h2>出一張考卷</h2>
      <p class="muted" style="margin-top:0">像寫紙本考卷一樣：先考單字，再考文法，最後閱讀。全部寫完再交卷，一次看分數和解析。</p>
      <div class="field"><span class="lab">範圍</span><div class="range"><select id="pf">${opt(pcfg.from)}</select><span class="muted">到</span><select id="pt">${opt(pcfg.to)}</select></div></div>
      <div class="field"><span class="lab">題數</span><div class="range" style="flex-wrap:wrap;gap:12px">
        <label>單字 <input type="number" id="pnv" min="0" max="40" value="${pcfg.nv}" style="width:5em"></label>
        <label>文法 <input type="number" id="png" min="0" max="30" value="${pcfg.ng}" style="width:5em"></label>
        <label>閱讀文章 <input type="number" id="pnr" min="0" max="3" value="${pcfg.nr}" style="width:4em"> 篇</label></div></div>
      <p class="muted small">第 16 課以後目前只有單字，選到那幾課時會只出單字題。</p>
      <button class="go" id="pgo">產生考卷</button></div>`;
    const f=document.getElementById("pf"),t=document.getElementById("pt");
    f.onchange=()=>{if(+f.value>+t.value)t.value=f.value};t.onchange=()=>{if(+t.value<+f.value)f.value=t.value};
    document.getElementById("pgo").onclick=()=>{pcfg={from:+f.value,to:+t.value,nv:Math.max(0,+document.getElementById("pnv").value||0),ng:Math.max(0,+document.getElementById("png").value||0),nr:Math.max(0,+document.getElementById("pnr").value||0)};buildPaper();if(!pAll().length){paper=null;alert("這個範圍沒有題目，請換一個範圍。");return}renderPaper();window.scrollTo(0,0)};
    return;
  }
  const done=paper.done;let no=0,passShown=new Set();
  const qHTML=it=>{no++;const q=it.q;let t;
    if(q.passage)t=`<span lang="ja">${esc(q.ask)}</span>`;
    else if(q.gq)t=`<span lang="ja">${esc(q.gq)}</span>`;
    else if(q.id.endsWith(":r"))t=`<u lang="ja">${esc(q.jp)}</u>`;
    else if(q.zhp)t=`「${esc(q.zhp)}」的日文是？`;
    else if(q.type==="conj")t=`<span lang="ja"><u>${esc(q.jp)}</u></span>　${esc(q.ask)}`;
    else t=`<u lang="ja">${esc(q.jp)}</u>　是什麼意思？`;
    const ok=done&&it.sel!=null&&it.opts[it.sel]===q.ans;
    if(done&&onlyWrong&&ok)return book;
    let pass="";if(q.passage&&!passShown.has(q.passage.id)){passShown.add(q.passage.id);pass=`<div class="passage ${done?"":"noruby"}" lang="ja" style="margin-top:14px"><b>${esc(q.passage.title)}</b><br>${done?annot(q.passage):ruby(q.passage.text)}</div>`}
    const book=done&&q.passage&&lastOf.has(it)?answerBook(q.passage,all.filter(x=>x.q.passage===q.passage)):"";
    return pass+`<div class="pq" id="pq${no}"><div class="qt"><span class="qn">${no}.</span>${t}</div>
      <div class="popts">${it.opts.map((o,i)=>{let c="popt";if(it.sel===i)c+=" sel";if(done){if(o===q.ans)c+=" right";else if(it.sel===i)c+=" wrong"}
        return `<button class="${c}" data-pi="${no-1}" data-o="${i}" ${done?"disabled":""}><span class="k">${i+1}</span><span${la(o)}>${esc(o)}</span></button>`}).join("")}</div>
      ${done&&!ok&&!q.passage?`<div class="pexp">${it.sel==null?"沒有作答。":""}正確答案：<b${la(q.ans)}>${esc(q.ans)}</b>　${esc(q.exp)}${q.zh?`<span class="muted">（${esc(q.zh)}）</span>`:""}</div>`:""}</div>`+book};
  const all=pAll();
  const lastOf=new Set();{const lp=new Map();all.forEach(x=>{if(x.q.passage)lp.set(x.q.passage.id,x)});lp.forEach(x=>lastOf.add(x))}
  let score="";
  if(done){
    const secScore=paper.secs.map(sc=>{const its=sc.parts.flatMap(p=>p.items);const c=its.filter(x=>x.sel!=null&&x.opts[x.sel]===x.q.ans).length;return [sc.t.split("　")[1]||sc.t,c,its.length]});
    const tc=secScore.reduce((a,x)=>a+x[1],0);
    score=`<div class="pscore"><div class="stat"><b>${Math.round(tc/all.length*100)}%</b><span>總分（${tc}/${all.length}）</span></div>${secScore.map(x=>`<div class="stat"><b>${x[1]}/${x[2]}</b><span>${esc(x[0])}</span></div>`).join("")}</div>
      <div class="chips" style="margin-bottom:6px"><button class="chip" id="pw" aria-pressed="${onlyWrong}">${onlyWrong?"顯示全部題目":"只看錯題"}</button></div>`;
  }
  root.innerHTML=`<div class="panel"><div class="paper-h"><div><div class="muted small">第${paper.from}課 ～ 第${paper.to}課　共 ${all.length} 題</div><h2>日文測驗卷</h2></div>
    <div class="muted">${done?`作答時間 ${fmt(Math.floor((paper.t1-paper.t0)/1000))}`:`作答時間 <span id="ptime">${fmt(Math.floor((Date.now()-paper.t0)/1000))}</span>`}</div></div>
    ${score}
    ${paper.secs.map(sc=>`<div class="psec"><h3>${esc(sc.t)}</h3>${sc.parts.map(pt=>`<div class="pinst">${esc(pt.inst)}</div>${pt.items.map(qHTML).join("")}`).join("")}</div>`).join("")}
    <div class="pfoot">${done?`<button class="primary" id="pnew">再出一張</button><button class="ghost" id="pset">換範圍</button>`:`<span class="muted" style="align-self:center" id="pleft"></span><button class="finish" id="psub">交卷</button>`}</div></div>`;
  root.querySelectorAll("#v-paper [data-say], .abook [data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const upd=()=>{const l=document.getElementById("pleft");if(l){const n=all.filter(x=>x.sel==null).length;l.textContent=n?`還有 ${n} 題沒寫`:"全部寫完了"}};upd();
  root.querySelectorAll("[data-pi]").forEach(b=>b.onclick=()=>{const it=all[+b.dataset.pi];it.sel=+b.dataset.o;b.parentNode.querySelectorAll(".popt").forEach(x=>x.classList.toggle("sel",x===b));upd()});
  const sub=document.getElementById("psub");if(sub)sub.onclick=()=>{const n=all.filter(x=>x.sel==null).length;if(n&&!confirm(`還有 ${n} 題沒寫，確定要交卷嗎？`))return;
    paper.done=true;paper.t1=Date.now();clearInterval(ptick);all.forEach(it=>rec(it.q,it.sel!=null&&it.opts[it.sel]===it.q.ans));updTab();renderPaper();window.scrollTo(0,0)};
  const w=document.getElementById("pw");if(w)w.onclick=()=>{onlyWrong=!onlyWrong;renderPaper()};
  const nw=document.getElementById("pnew");if(nw)nw.onclick=()=>{buildPaper();renderPaper();window.scrollTo(0,0)};
  const st=document.getElementById("pset");if(st)st.onclick=()=>{paper=null;renderPaper();window.scrollTo(0,0)};
}

/* ---------- 分類筆記 ---------- */
let nbcat=(S.nbcat&&NB.some(c=>c.id===S.nbcat))?S.nbcat:(NB[0]&&NB[0].id);
function nbMark(k){return esc(k).replace(/\{(.*?)\}/g,'<mark class="y">$1</mark>').replace(/&lt;(.*?)&gt;/g,'<mark class="b">$1</mark>')}
function renderNB(nav){
  const root=document.getElementById("v-nb");
  if(!NB.length){root.innerHTML=`<div class="panel empty">分類筆記準備中。</div>`;return}
  const lvF=S.nblv||"all",inLv=x=>lvF==="all"||String(x.lv)===lvF;
  const cnt=c=>c.groups.reduce((a,g)=>a+g.w.filter(inLv).length,0);
  if(!root.querySelector(".kwrap")){
    root.innerHTML=`<div class="kwrap"><aside class="panel side toc2"><div class="lab">日檢 N5・N4 分類</div><div id="nbside"></div></aside><div id="nbmain"></div></div>`;
    root.querySelector(".side").addEventListener("click",e=>{const b=e.target.closest("[data-nb]");if(!b)return;nbcat=b.dataset.nb;S.nbcat=nbcat;save();renderNB(true)});
  }
  const sideEl=root.querySelector("#nbside"),st=root.querySelector(".side").scrollTop;
  sideEl.innerHTML=NB.map((c,i)=>`<button data-nb="${c.id}" class="${c.id===nbcat?"on":""}"><span>${esc(c.t)}</span><span class="muted small">${cnt(c)}${S.done.includes("nb:"+c.id)?' <span class="ck">✓</span>':""}</span></button>`).join("");
  root.querySelector(".side").scrollTop=st;
  const c=NB.find(x=>x.id===nbcat),idx=NB.indexOf(c),done=S.done.includes("nb:"+c.id);
  const say=t=>`<button class="say" data-say="${esc(t)}" aria-label="發音">🔊</button>`;
  const body=c.groups.map(g=>{const ws=g.w.filter(inLv);if(!ws.length)return "";
    return `<div class="nbg"><h3>${esc(g.t)}</h3>${g.n?`<div class="knote">${esc(g.n)}</div>`:""}<div class="nbgrid">${ws.map(x=>{const r=nbPlain(x.k);
      return `<div class="nbw"><div class="nbh"><span class="nbk" lang="ja">${nbMark(x.k)}</span>${x.j?`<span class="nbj" lang="ja">（${esc(x.j)}）</span>`:""}${say(r.replace(/^〜/,""))}<span class="nbz">${esc(x.z)}</span>${lvF==="all"&&x.lv===4?`<span class="nblv">N4</span>`:""}</div>
        ${x.e?sentBlock(x.e,x.ez,(x.j?x.j.replace(/[（(].*$/,"")+"|":"")+r.split("／")[0].replace(/^〜/,""),1):""}</div>`}).join("")}</div></div>`}).join("");
  const total=cnt(c);
  root.querySelector("#nbmain").innerHTML=`<div class="panel nbpaper ${S.nbbrief?"nbbrief":""} ${hideRd?"hr":""}"><div class="nbsheet" style="padding:4px 6px">
    <div class="bkhead"><div><div class="muted small">日檢分類筆記　${total} 個單字</div><h2>${esc(c.t)}</h2></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="nbb" aria-pressed="${!!S.nbbrief}">${S.nbbrief?"顯示例句":"只看單字"}</button></div></div>
    <div class="nbbar">${[["all","N5＋N4"],["5","只看 N5"],["4","只看 N4"]].map(([k,n])=>`<button class="chip" data-lv="${k}" aria-pressed="${lvF===k}">${n}</button>`).join("")}
      <span class="legend"><mark class="b">藍色</mark>＝特殊讀法，要特別記　<mark class="y">黃色</mark>＝同一組共用的部分</span></div>
    ${c.n?`<div class="ttip"><b>先看這裡</b>　${esc(c.n)}</div>`:""}
    ${body||`<div class="empty">這個等級在本分類沒有單字。</div>`}
    <div class="lbtns" style="margin-top:18px"><button class="primary" id="nbq">練習這個分類</button><button class="ghost" id="nbd">${done?"✓ 已讀完（點一下取消）":"標記為已讀完"}</button>${idx<NB.length-1?`<button class="ghost" id="nbx">下一個：${esc(NB[idx+1].t)}</button>`:""}</div>
  </div></div>`;
  const main=root.querySelector("#nbmain");
  if(nav){const y=main.getBoundingClientRect().top+window.scrollY-12;if(window.innerWidth<=760||window.scrollY>y)window.scrollTo(0,y)}
  main.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say)});
  main.querySelectorAll(".rd,.ksent").forEach(e=>e.onclick=()=>e.classList.toggle("show"));
  main.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.nblv=b.dataset.lv;save();renderNB()});
  document.getElementById("nbb").onclick=()=>{S.nbbrief=!S.nbbrief;save();renderNB()};
  document.getElementById("nbq").onclick=()=>{const p=ALL.filter(q=>q.sec==="nb:"+c.id&&(lvF==="all"||String(q.nlv)===lvF));if(!p.length)return;startSession(shuffle(p).slice(0,20),"practice")};
  document.getElementById("nbd").onclick=()=>{S.done=done?S.done.filter(x=>x!=="nb:"+c.id):S.done.concat("nb:"+c.id);save();renderNB()};
  const x=document.getElementById("nbx");if(x)x.onclick=()=>{nbcat=NB[idx+1].id;S.nbcat=nbcat;save();renderNB(true)};
}

/* ---------- 錯題與收藏 ---------- */
let rf="wrong";
function renderReview(){
  const root=document.getElementById("v-review");
  const ids=rf==="wrong"?S.wrong:S.fav;const qs=ids.map(id=>BYID[id]).filter(Boolean);
  root.innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
    <div class="chips"><button class="chip" aria-pressed="${rf==="wrong"}" data-r="wrong">錯題 (${S.wrong.length})</button><button class="chip" aria-pressed="${rf==="fav"}" data-r="fav">收藏 (${S.fav.length})</button></div>
    <div style="display:flex;gap:8px">${qs.length?`<button class="primary" id="drill">練習這 ${qs.length} 題</button>`:""}<button class="ghost small" id="clr">清空${rf==="wrong"?"錯題":"收藏"}</button></div></div>
    <p class="muted small" style="margin:0 0 6px">${rf==="wrong"?"答錯的題目會自動放進來，之後答對一次就會移出。":"在題目右上角點 ★ 就會收藏。"}</p>
    ${qs.length?qs.map(q=>itemHTML(q)).join(""):`<div class="empty">${rf==="wrong"?"目前沒有錯題。":"還沒有收藏的題目。"}</div>`}</div>`;
  root.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rf=b.dataset.r;renderReview()});
  bindItems(root,()=>{updTab();if(rf==="fav")renderReview()});
  const d=document.getElementById("drill");if(d)d.onclick=()=>startSession(shuffle(qs),"practice");
  document.getElementById("clr").onclick=()=>{if(confirm("確定要清空嗎？")){if(rf==="wrong")S.wrong=[];else S.fav=[];save();updTab();renderReview()}};
}

/* ---------- 雲端同步（網頁版才會啟動） ---------- */
(function(){
  if(!(window.claude&&window.claude.use))return;
  const setSync=t=>{const e=document.getElementById("sync");if(e)e.textContent=t};
  const h=x=>{let v=5381;for(let i=0;i<x.length;i++)v=((v<<5)+v+x.charCodeAt(i))|0;return (v>>>0).toString(36)};
  const H2ID={};ALL.forEach(q=>{H2ID[h(q.id)]=q.id});
  const pack=()=>({t:S.t||Date.now(),q:Object.fromEntries(Object.entries(S.q).filter(([k])=>BYID[k]).map(([k,v])=>[h(k),[v.c,v.w]])),
    wrong:S.wrong.map(h),fav:S.fav.map(h),rest:JSON.stringify({done:S.done||[],ksec:S.ksec||null,kview:S.kview||null})});
  const unpack=d=>{const q={};Object.entries(d.q||{}).forEach(([k,v])=>{const id=H2ID[k];if(id)q[id]={c:v[0],w:v[1]}});
    let r={};try{r=JSON.parse(d.rest||"{}")}catch(e){}
    return Object.assign({},S,r,{q,wrong:(d.wrong||[]).map(k=>H2ID[k]).filter(Boolean),fav:(d.fav||[]).map(k=>H2ID[k]).filter(Boolean),t:d.t})};
  let ref=null,timer=null,busy=false,again=false;
  const push=async()=>{if(!ref)return;if(busy){again=true;return}busy=true;
    try{await ref.set(pack());setSync("☁ 已同步")}catch(e){setSync("⚠ 暫時無法同步，進度先存在這台裝置")}
    busy=false;if(again){again=false;push()}};
  window.__cloudSave=()=>{if(!ref)return;clearTimeout(timer);timer=setTimeout(push,2500)};
  (async()=>{
    const db=await claude.use("db");if(!db){setSync("");return}
    const user=await claude.use("user");const id=user?await user.id():null;if(!id)return;
    ref=db.doc("data/users/"+id+"/progress");
    try{
      const snap=await ref.get();
      if(snap.exists){const d=snap.data();
        if((d.t||0)>(S.t||0)){S=unpack(d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
          if(S.ksec&&PAGES_OK(S.ksec))ksec=S.ksec;updTab();if(view!=="quiz"&&view!=="paper")show(view);setSync("☁ 已同步")}
        else if((S.t||0)>(d.t||0))push();else setSync("☁ 已同步");
      }else push();
    }catch(e){setSync("⚠ 暫時無法同步，進度先存在這台裝置")}
  })();
})();

{const sk=document.getElementById("skin");let cur="milk";try{cur=localStorage.getItem("jpquiz-skin")||"milk"}catch(e){}sk.value=cur;
 sk.onchange=()=>{const v=sk.value;if(v==="milk")document.documentElement.removeAttribute("data-skin");else document.documentElement.setAttribute("data-skin",v);try{localStorage.setItem("jpquiz-skin",v)}catch(e){}};}
renderHome();
})();
